map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    expires -1;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_vary on;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/api(?:/|$) {
        # DNS atualizado após recriar o backend, sem reiniciar o front.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
