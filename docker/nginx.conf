map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    expires -1;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/html já entra por padrão. woff2/webp/jpg/ktx2 já vêm comprimidos.
    gzip_types text/css text/plain text/javascript application/javascript application/json
               application/manifest+json application/wasm image/svg+xml;
    gzip_vary on;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/api(?:/|$) {
        # DNS atualizado após recriar o backend, sem reiniciar o front.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Hash no nome (Vite): conteúdo nunca muda na mesma URL. ^~ impede o regex abaixo
    # de pegar /assets/*.png. `expires off` anula o -1 herdado do server; add_header
    # aqui zera os do server, então os de segurança vão repetidos. Cache-Control sem
    # `always`: 404 de chunk (deploy no meio da sessão) não pode ficar em cache 1 ano.
    location ^~ /assets/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Arquivos de public/ (pôster, fontes, imagens) sem hash: 30 dias. Trocar o
    # conteúdo = trocar o nome do arquivo, ou o visitante segue com o antigo.
    location ~* \.(?:webp|jpe?g|png|svg|woff2|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
