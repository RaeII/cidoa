<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4E6B45" />
    <title>Cidoe</title>
    <!-- Fontes do sistema de design, self-hosted (@font-face em src/index.css): sem CSS
         externo bloqueando o 1º paint. Preload só da Manrope latin (texto do 1º paint);
         JetBrains Mono só aparece com a cena e baixa sob demanda. -->
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Aplica tema salvo/do sistema antes do paint — evita flash (só afeta o /admin).
      (function () {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <!-- Pôster da cidade pintado antes do JS (1º paint útil sem esperar o bundle). O React
         troca pelo mesmo pôster (CityPoster, mesma caixa, sem pisca nem CLS), que some com
         fade quando a cena aplica as doações. Não é candidato a LCP (cobre a viewport). -->
    <div id="root"><picture id="city-poster"><source media="(orientation: portrait)" srcset="/city-poster-portrait.webp" /><img src="/city-poster-landscape.webp" alt="" style="position:absolute;top:0;left:0;width:100%;height:100vh;object-fit:cover;pointer-events:none" /></picture></div>
    <script>
      // Pôster é só da cena (/); outras rotas (/dale, /termos…) começam limpas.
      if (location.pathname !== '/') document.getElementById('city-poster').remove()
    </script>
    <!-- Sem JS (robôs, verificação do login com Google): o que é o site + links legais. -->
    <noscript>
      <p>Cidoe: cidade 3D em que cada contribuição para uma ONG de proteção animal ergue um edifício.</p>
      <p><a href="/termos">Termos de Uso</a> · <a href="/privacidade">Política de Privacidade</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
