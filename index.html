<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4E6B45" />
    <title>Cidoa — Pré-lançamento</title>
    <meta name="description" content="Cadastre-se no pré-lançamento do Cidoa, indique amigos e teste sua cidade com pagamentos simulados." />
    <!-- Fontes do sistema de design: Manrope (leitura, valores) + JetBrains Mono (rótulos, placar). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <script>
      // Aplica tema salvo/do sistema antes do paint — evita flash. Escuro é só do /dale:
      // fora dele a cena fica sempre clara, mesmo com sistema escuro ou tema salvo no admin.
      (function () {
        if (!location.pathname.startsWith('/dale')) return
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      })()
    </script>
    <!-- Google Identity Services (login com Google). Carrega assíncrono. -->
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
