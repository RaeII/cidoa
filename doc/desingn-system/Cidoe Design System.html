pe=\"rect\" fit=\"contain\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">96 · Logo de ONG<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size:16px;line-height:1.5;color:#4A5446;max-width:46ch\">Quadrados, nunca círculos — o canto em pixel é a assinatura. Sem foto, use as iniciais em mono sobre Verde 100 ou o bichinho do doador. Logo de ONG inteiro, com 8px de respiro, nunca recortado.<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:28px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">5.7 · Estados<\u002Fspan>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:28px 24px;align-items:start\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"aspect-ratio:3/2;background:#D9D3C2;margin:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B\">\n              <div style=\"width:64%;display:flex;gap:2px;padding:3px;background:#FBF9F3;margin:2px;box-shadow:0 -2px 0 0 #1E2A1B,0 2px 0 0 #1E2A1B,-2px 0 0 0 #1E2A1B,2px 0 0 0 #1E2A1B\"><sc-for list=\"{{ loadBlocks }}\" as=\"b\" hint-placeholder-count=\"10\"><span style=\"flex:1;height:8px;background:{{ b }}\"><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4E6B45;padding-top:4px\">Carregando<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.45;color:#4A5446\">Papel 300 e blocos enchendo. Nada de spinner ou brilho deslizante.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"aspect-ratio:3/2;background:#FBF9F3;margin:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B\">\n              <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 8 8\" style=\"shape-rendering:crispEdges\"><path fill=\"#1E2A1B\" d=\"M0 0h8v1h-8zM0 1h1v6h-1zM7 1h1v6h-1zM0 7h8v1h-8z\"><\u002Fpath><path style=\"fill:var(--aux)\" d=\"M5 2h1v1h-1z\"><\u002Fpath><path fill=\"#4E6B45\" d=\"M2 4h1v1h-1zM1 5h3v1h-3zM5 5h1v1h-1zM1 6h6v1h-6z\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">Foto indisponível<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4E6B45;padding-top:4px\">Indisponível<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.45;color:#4A5446\">Ícone em pixel e uma frase. A moldura fica; o layout não pula.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"transition:transform 70ms ease-out,box-shadow 70ms ease-out;position:relative;aspect-ratio:3/2;background:#D9D3C2;margin:3px;cursor:var(--paw);box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B,var(--bh)\" style-hover=\"box-shadow:0 -3px 0 0 #4E6B45,0 3px 0 0 #4E6B45,-3px 0 0 0 #4E6B45,3px 0 0 0 #4E6B45,var(--bh)\" style-active=\"box-shadow:0 -3px 0 0 #4E6B45,0 3px 0 0 #4E6B45,-3px 0 0 0 #4E6B45,3px 0 0 0 #4E6B45,var(--bh-press);transform:translate(var(--bt),var(--bt))\"><image-slot id=\"img-clicavel\" shape=\"rect\" placeholder=\"Foto\"><\u002Fimage-slot><\u002Fdiv>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4E6B45;padding-top:4px\">Clicável<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.45;color:#4A5446\">Ganha a sombra dura dos botões. No hover a borda fica verde; ao pressionar, anda 4px.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:28px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">5.8 · Direção de foto<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px 56px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:22px;height:22px;background:#4E6B45;display:inline-flex;align-items:center;justify-content:center\"><svg width=\"12\" height=\"10\" sc-camel-view-box=\"0 0 10 8\" style=\"shape-rendering:crispEdges\"><path fill=\"#F2EEE3\" d=\"M8 1h2v1h-2zM7 2h2v1h-2zM6 3h2v1h-2zM0 4h2v1h-2zM5 4h2v1h-2zM1 5h2v1h-2zM4 5h2v1h-2zM2 6h3v1h-3z\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">Faça<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"width:6px;height:6px;flex:none;margin-top:11px;background:#4E6B45\"><\u002Fspan><span style=\"font-size:17px;line-height:1.55\">Animal em primeiro plano, com a câmera na altura dos olhos dele.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"width:6px;height:6px;flex:none;margin-top:11px;background:#4E6B45\"><\u002Fspan><span style=\"font-size:17px;line-height:1.55\">Luz natural, de dia. Cores reais da pelagem.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"width:6px;height:6px;flex:none;margin-top:11px;background:#4E6B45\"><\u002Fspan><span style=\"font-size:17px;line-height:1.55\">Gente da ONG cuidando: banho, vacina, colo, passeio.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"width:6px;height:6px;flex:none;margin-top:11px;background:#4E6B45\"><\u002Fspan><span style=\"font-size:17px;line-height:1.55\">Um assunto por foto, com respiro em volta para o recorte.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;background:#1E2A1B;color:var(--aux);width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center\">!<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">Evite<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"width:6px;height:6px;flex:none;margin-top:11px;background:var(--aux-700)\"><\u002Fspan><span style=\"font-size:17px;line-height:1.55\">Sofrimento, ferimentos ou grades em destaque. Culpa afasta; confiança aproxima.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"width:6px;height:6px;flex:none;margin-top:11px;background:var(--aux-700)\"><\u002Fspan><span style=\"font-size:17px;line-height:1.55\">Banco de imagem genérico. Se não é da ONG, não entra.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"width:6px;height:6px;flex:none;margin-top:11px;background:var(--aux-700)\"><\u002Fspan><span style=\"font-size:17px;line-height:1.55\">Texto, logo ou marca d'água gravados na foto.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"width:6px;height:6px;flex:none;margin-top:11px;background:var(--aux-700)\"><\u002Fspan><span style=\"font-size:17px;line-height:1.55\">Esticar, espelhar ou cortar o animal pela metade.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px 40px;padding-top:28px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4E6B45\">Formato<\u002Fspan><span style=\"font-size:15px;line-height:1.5\">WebP, com JPG de reserva. PNG só para sprite.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4E6B45\">Resolução<\u002Fspan><span style=\"font-size:15px;line-height:1.5\">2× o tamanho exibido; mínimo de 1200px no lado maior.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4E6B45\">Peso<\u002Fspan><span style=\"font-size:15px;line-height:1.5\">Até 300 KB na interface; 1 MB nas redes.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4E6B45\">Texto alternativo<\u002Fspan><span style=\"font-size:15px;line-height:1.5\">Obrigatório. Animal + ação: \"Cadela caramelo recebendo vacina\".<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"componentes\" style=\"padding:112px 0 0\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;margin-bottom:16px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#4E6B45;display:inline-flex;align-items:center;gap:8px\"><svg width=\"14\" height=\"12\" sc-camel-view-box=\"0 0 9 8\" style=\"shape-rendering:crispEdges\" aria-hidden=\"true\"><path fill=\"#4E6B45\" d=\"M2 0h2v2h-2zM5 0h2v2h-2zM0 2h2v2h-2zM7 2h2v2h-2zM3 3h3v1h-3zM2 4h5v1h-5zM1 5h7v2h-7zM2 7h2v1h-2zM5 7h2v1h-2z\"><\u002Fpath><\u002Fsvg>06<\u002Fspan><h2 style=\"font-family:'Manrope',sans-serif;font-weight:600;font-size:44px;line-height:1.05;margin:0\">Componentes<\u002Fh2><\u002Fdiv>\n    <p style=\"font-size:19px;line-height:1.55;max-width:60ch;margin:0 0 56px;color:#4A5446;text-wrap:pretty\">Todos interativos — clique para testar estados.<\u002Fp>\n\n    <div style=\"display:flex;flex-direction:column;gap:20px;margin-bottom:80px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">6.1 · Botões<\u002Fspan>\n      <div style=\"display:flex;gap:24px;flex-wrap:wrap;align-items:center\">\n        <button style=\"transition:transform 70ms ease-out,box-shadow 70ms ease-out;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em;color:#F2EEE3;background:#4E6B45;border:none;padding:14px 22px 18px;margin:3px;cursor:var(--paw);display:inline-flex;align-items:center;gap:10px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B,var(--bh),inset 0 -4px 0 0 #3A5134\" style-hover=\"background:#5A7B50\" style-active=\"padding:calc(14px + var(--bp)) 22px calc(18px - var(--bp));box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B,var(--bh-press),inset 0 calc(4px * var(--bd)) 0 0 #3A5134;transform:translate(var(--bt),var(--bt))\"><svg width=\"16\" height=\"12\" sc-camel-view-box=\"0 0 8 6\" style=\"shape-rendering:crispEdges\"><path fill=\"#F2EEE3\" d=\"M1 0h2v1h-2zM5 0h2v1h-2zM0 1h8v2h-8zM1 3h6v1h-6zM2 4h4v1h-4zM3 5h2v1h-2z\"><\u002Fpath><\u002Fsvg>Doar e construir<\u002Fbutton>\n        <button style=\"transition:transform 70ms ease-out,box-shadow 70ms ease-out;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em;color:#1E2A1B;background:#FBF9F3;border:none;padding:14px 22px 18px;margin:3px;cursor:var(--paw);box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B,var(--bh),inset 0 -4px 0 0 #D9D3C2\" style-hover=\"background:#DCE4D5\" style-active=\"padding:calc(14px + var(--bp)) 22px calc(18px - var(--bp));box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B, E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B,var(--bh-press),inset 0 calc(4px * var(--bd)) 0 0 #3A5134\">Doar<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">Pressionado<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\"><span style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;color:#F2EEE3;background:#4E6B45;padding:14px 22px 18px;margin:3px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B,var(--bh),inset 0 -4px 0 0 #3A5134;outline:3px solid var(--aux);outline-offset:6px\">Doar<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">Foco (teclado)<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\"><span style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;color:#F2EEE3;background:#4E6B45;padding:14px 22px 18px;margin:3px;opacity:.45;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B,var(--bh),inset 0 -4px 0 0 #3A5134\">Doar<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">Desabilitado<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-size:15px;line-height:1.5;color:#4A5446;max-width:62ch\">Sombra dura de 4px na diagonal, com luz vindo do canto superior esquerdo. Ao pressionar, o botão anda 4px e a sombra vai a zero; o bisel interno não muda.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:56px;margin-bottom:80px\">\n      <div style=\"display:flex;flex-direction:column;gap:28px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">6.2 · Campos<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <label style=\"font-fa data-props=\"{&quot;nivel&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;min&quot;:1,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;HUD&quot;},&quot;xp&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:6,&quot;min&quot;:0,&quot;max&quot;:10,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;HUD&quot;},&quot;zonasSeguras&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Redes sociais&quot;},&quot;abrirModal&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Componentes&quot;}}\">\nclass Component extends DCLogic {\n  state = { checks: [true, false, true], pay: 'pix', toggles: [true, false], amount: 50, valorTxt: '50,00', tab: 'cidade', step: 'confirmar', recorrente: true, qty: 3, live: false, load: 3 };\n  componentDidMount() { this._lt = setInterval(() => this.setState(st => ({ load: (st.load + 1) % 11 })), 320); }\n  componentWillUnmount() { clearInterval(this._lt); }\n  setAmount(v) { this.setState({ amount: v, valorTxt: v + ',00' }); }\n  renderVals() {\n    const s = this.state, p = this.props;\n    const G = '#4E6B45', I = '#1E2A1B', P = '#F2EEE3', W = '#FBF9F3', A = 'var(--aux)', L = '#D9D3C2';\n    const nb = (c, w) => `0 -${w}px 0 0 ${c},0 ${w}px 0 0 ${c},-${w}px 0 0 ${c},${w}px 0 0 ${c}`;\n    const nivel = p.nivel ?? 7;\n    const xp = Math.max(0, Math.min(10, p.xp ?? 6));\n    const blocks = n => Array.from({ length: 10 }, (_, i) => i < n ? G : i === n ? A : L);\n    const checkLabels = ['Receber recibo da doação por e-mail', 'Mostrar meu nome no prédio', 'Avisar quando a ONG postar novidades'];\n    const pays = [\n      { id: 'pix', label: 'Pix', meta: 'Aprovação na hora' },\n      { id: 'cartao', label: 'Cartão de crédito', meta: 'Recorrência mensal' },\n      { id: 'boleto', label: 'Boleto', meta: 'Até 2 dias úteis' }\n    ];\n    const tgl = [{ label: 'Sons da cidade' }, { label: 'Modo noturno da cena' }];\n    const tabs = [{ id: 'cidade', label: 'Cidade' }, { id: 'doacoes', label: 'Minhas doações' }, { id: 'ongs', label: 'ONGs' }];\n    const a = s.amount;\n    const bName = a < 50 ? 'Casa térrea' : a < 100 ? 'Sobrado · 2 andares' : a < 200 ? 'Prédio · 4 andares' : 'Torre · 8 andares';\n    const gainBlocks = Math.min(10, xp + Math.max(1, Math.round(a / 50)));\n    return {\n      demoBlocks: blocks(6),\n      nivel, xpLabel: `${xp * 100}/1000 XP`, xpBlocks: blocks(xp), xpBlocksAfter: blocks(gainBlocks),\n      ongBlocks: Array.from({ length: 12 }, (_, i) => i < 8 ? G : L),\n      fullBlocks: Array.from({ length: 10 }, (_, i) => i),\n      checks: checkLabels.map((label, i) => ({\n        label, on: s.checks[i], bg: s.checks[i] ? G : W,\n        toggle: () => this.setState(st => { const c = [...st.checks]; c[i] = !c[i]; return { checks: c }; })\n      })),\n      pays: pays.map(x => ({ ...x, on: s.pay === x.id, bg: s.pay === x.id ? '#DCE4D5' : 'transparent', ring: s.pay === x.id ? nb(G, 2) : 'none', pick: () => this.setState({ pay: x.id }) })),\n      toggles: tgl.map((t, i) => {\n        const on = s.toggles[i];\n        return { label: t.label, state: on ? 'Ligado' : 'Desligado', track: on ? G : L, knob: on ? P : I, justify: on ? 'flex-end' : 'flex-start',\n          flip: () => this.setState(st => { const c = [...st.toggles]; c[i] = !c[i]; return { toggles: c }; }) };\n      }),\n      amounts: [20, 50, 100, 200].map(v => {\n        const on = a === v;\n        return { label: 'R$ ' + v, fg: on ? P : I, bg: on ? G : W, shadow: nb(I, 2) + `,inset 0 -4px 0 0 ${on ? '#3A5134' : L}`, pick: () => this.setAmount(v) };\n      }),\n      amount: a, valorTxt: s.valorTxt,\n      onValor: e => { const t = e.target.value; const n = parseInt(t.replace(/\\D/g, '').slice(0, -2) || t, 10); this.setState({ valorTxt: t, amount: isNaN(n) ? 0 : n }); },\n      qty: s.qty,\n      dec: () => this.setState(st => ({ qty: Math.max(1, st.qty - 1) })),\n      inc: () => this.setState(st => ({ qty: Math.min(24, st.qty + 1) })),\n      tabs: tabs.map(t => ({ ...t, on: s.tab === t.id, fg: s.tab === t.id ? I : '#4A5446', line: s.tab === t.id ? `inset 0 -4px 0 0 ${G}` : 'none', pick: () => this.setState({ tab: t.id }) })),\n      isConfirm: s.step === 'confirmar', isSuccess: s.step === 'sucesso',\n      modalKicker: s.step === 'confirmar' ? 'Doação · Passo 1 de 2' : 'Doação · Concluída',\n      buildingName: bName, buildingNameLower: bName.split(' · ')[0].toLowerCase(), xpGain: a,\n      recorrente: s.recorrente, recBg: s.recorrente ? G : W,\n      toggleRec: () => this.setState(st => ({ recorrente: !st.recorrente })),\n      confirmDonation: () => this.setState({ step: 'sucesso' }),\n      resetModal: () => this.setState({ step: 'confirmar' }),\n      liveModal: s.live || !!p.abrirModal,\n      openModal: () => this.setState({ live: true }),\n      closeLive: () => this.setState({ live: false }),\n      stop: e => e.stopPropagation(),\n      loadBlocks: Array.from({ length: 10 }, (_, i) => i < s.load ? G : L),\n      zonasSeguras: !!p.zonasSeguras\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
