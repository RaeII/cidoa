document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1720b0a3-35fe-4cbf-bdde-e20e5f90d1dc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"b8c74de9-580d-4706-96d7-a03f4cee20c8\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"cf0e271b-f0b0-4fbb-9e62-f788e9bdd4ad\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"3343ed7c-f3ac-430f-978b-86fe4d5796c4\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"29bbe76c-9ec4-43b0-bbc5-469e4be4d9d7\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"4942b5d8-67dd-4a6d-8091-c2e7bb3c0613\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"1720b0a3-35fe-4cbf-bdde-e20e5f90d1dc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #0088b0;\n  --color-accent-2: #d6006c;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #e9f8ff;\n  --color-accent-200: #cbeeff;\n  --color-accent-300: #99e0ff;\n  --color-accent-400: #62c5ee;\n  --color-accent-500: #38a6cf;\n  --color-accent-600: #1186ac;\n  --color-accent-700: #006786;\n  --color-accent-800: #004961;\n  --color-accent-900: #0a303e;\n\n  --color-accent-2-100: #fff1f4;\n  --color-accent-2-200: #ffdee6;\n  --color-accent-2-300: #ffc0d0;\n  --color-accent-2-400: #ff90b1;\n  --color-accent-2-500: #ff458e;\n  --color-accent-2-600: #d82071;\n  --color-accent-2-700: #aa0b56;\n  --color-accent-2-800: #790e3d;\n  --color-accent-2-900: #4b1528;\n\n  /* The third process ink — review round 3: the deck's print treatments\n     (the CMYK separation and the misregistered plate numerals below) need\n     the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space ground: var(--aux); color: #1E2A1B; }\n    :focus-visible { outline: 3px solid var(--aux); outline-offset: 4px; }\n    input::placeholder { color: #7A8275; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:1240px;margin:0 auto;padding:0 40px 120px;box-sizing:border-box\">\n\n  <header style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:28px 0\">\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 -2 14 14\" style=\"shape-rendering:crispEdges\"><path fill=\"#4E6B45\" d=\"M5 -2h1v1h-1zM8 -2h1v1h-1zM5 -1h2v1h-2zM7 -1h2v1h-2z\"><\u002Fpath><path fill=\"#4E6B45\" d=\"M0 5h4v7h-4zM5 0h4v12h-4zM10 3h4v9h-4z\"><\u002Fpath><path style=\"fill:var(--aux)\" d=\"M6 2h2v2h-2z\"><\u002Fpath><path fill=\"#F2EEE3\" d=\"M1 7h2v1h-2zM11 5h2v1h-2zM11 8h2v1h-2zM6 6h2v1h-2zM6 9h2v3h-2z\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:24px;letter-spacing:-0.02em\">Cidoe<\u002Fspan>\n    <\u002Fdiv>\n    <nav style=\"display:flex;gap:28px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em\">\n      <a href=\"#cor\" style=\"text-decoration:none;color:#1E2A1B\">Cor<\u002Fa>\n      <a href=\"#tipo\" style=\"text-decoration:none;color:#1E2A1B\">Tipografia<\u002Fa>\n      <a href=\"#assinatura\" style=\"text-decoration:none;color:#1E2A1B\">Assinatura<\u002Fa>\n      <a href=\"#imagem\" style=\"text-decoration:none;color:#1E2A1B\">Imagem<\u002Fa>\n      <a href=\"#componentes\" style=\"text-decoration:none;color:#1E2A1B\">Componentes<\u002Fa>\n      <a href=\"#interface\" style=\"text-decoration:none;color:#1E2A1B\">Interface<\u002Fa>\n      <a href=\"#social\" style=\"text-decoration:none;color:#1E2A1B\">Redes sociais<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section style=\"padding:96px 0 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:32px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.06em;color:#4E6B45;display:flex;gap:18px;flex-wrap:wrap\">\n      <span>Sistema de design<\u002Fspan><span style=\"color:#1E2A1B\">v1.0<\u002Fspan><span style=\"color:#1E2A1B\">Out 2026<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family:'Manrope',sans-serif;font-weight:600;font-size:clamp(44px,7vw,96px);line-height:0.98;letter-spacing:-0.025em;margin:0;max-width:14ch;text-wrap:balance\">Cada doação ergue um prédio.<\u002Fh1>\n    <p style=\"font-size:22px;line-height:1.5;max-width:46ch;margin:0;color:#4A5446;text-wrap:pretty\">Cidoe é uma cidade construída por quem ajuda ONGs de proteção animal. O sistema une a clareza de um app financeiro — que passa confiança — com detalhes pequenos e precisos dos videogames de 8 bits.<\u002Fp>\n    <div style=\"display:flex;gap:20px;flex-wrap:wrap;padding-top:12px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#F2EEE3;background:#4E6B45;padding:12px 20px 14px;margin:3px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B,inset 0 -4px 0 0 #3A5134\">3 cores<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#1E2A1B;background:#FBF9F3;padding:12px 20px 14px;margin:3px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B,inset 0 -4px 0 0 #D9D3C2\">2 fontes<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#1E2A1B;background:var(--aux);padding:12px 20px 14px;margin:3px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B,inset 0 -4px 0 0 var(--aux-700)\">0 gradientes<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:88px 0 0\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;margin-bottom:36px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#4E6B45;display:inline-flex;align-items:center;gap:8px\"><svg width=\"14\" height=\"12\" sc-camel-view-box=\"0 0 9 8\" style=\"shape-rendering:crispEdges\" aria-hidden=\"true\"><path fill=\"#4E6B45\" d=\"M2 0h2v2h-2zM5 0h2v2h-2zM0 2h2v2h-2zM7 2h2v2h-2zM3 3h3v1h-3zM2 4h5v1h-5zM1 5h7v2h-7zM2 7h2v1h-2zM5 7h2v1h-2z\"><\u002Fpath><\u002Fsvg>01<\u002Fspan><h2 style=\"font-family:'Manrope',sans-serif;font-weight:600;font-size:44px;line-height:1.05;margin:0\">Princípios<\u002Fh2><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:48px 56px\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">A · Confiança primeiro<\u002Fspan>\n        <h3 style=\"font-size:26px;font-weight:600;line-height:1.2;margin:0\">O dinheiro é sério. O jogo é a recompensa.<\u002Fh3>\n        <p style=\"font-size:17px;line-height:1.6;margin:0;color:#4A5446;text-wrap:pretty\">Valores, ONGs e recibos aparecem em texto limpo, com números grandes e legíveis. O pixel vive nas bordas e ícones — nunca nas letras.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">B · Plano, sem truques<\u002Fspan>\n        <h3 style=\"font-size:26px;font-weight:600;line-height:1.2;margin:0\">Cor chapada, sombra sólida, nada de degradê.<\u002Fh3>\n        <p style=\"font-size:17px;line-height:1.6;margin:0;color:#4A5446;text-wrap:pretty\">Profundidade vem de um bisel de cor sólida na base dos elementos — o \"degrau\" de um botão de fliperama — nunca de desfoque.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">C · Pequenos detalhes de jogo<\u002Fspan>\n        <h3 style=\"font-size:26px;font-weight:600;line-height:1.2;margin:0\">Cantos em pixel, cursor ▸, barras em blocos.<\u002Fh3>\n        <p style=\"font-size:17px;line-height:1.6;margin:0;color:#4A5446;text-wrap:pretty\">O vocabulário de game é tempero: aparece em bordas, ícones e progresso. A cidade 3D é a protagonista; a interface só emoldura.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"cor\" style=\"padding:112px 0 0\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;margin-bottom:16px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#4E6B45;display:inline-flex;align-items:center;gap:8px\"><svg width=\"14\" height=\"12\" sc-camel-view-box=\"0 0 9 8\" style=\"shape-rendering:crispEdges\" aria-hidden=\"true\"><path fill=\"#4E6B45\" d=\"M2 0h2v2h-2zM5 0h2v2h-2zM0 2h2v2h-2zM7 2h2v2h-2zM3 3h3v1h-3zM2 4h5v1h-5zM1 5h7v2h-7zM2 7h2v1h-2zM5 7h2v1h-2z\"><\u002Fpath><\u002Fsvg>02<\u002Fspan><h2 style=\"font-family:'Manrope',sans-serif;font-weight:600;font-size:44px;line-height:1.05;margin:0\">Cor<\u002Fh2><\u002Fdiv>\n    <p style=\"font-size:19px;line-height:1.55;max-width:60ch;margin:0 0 40px;color:#4A5446;text-wrap:pretty\">Três cores, cada uma com um trabalho. O verde é a marca e a ação; o papel é o chão; o âmbar é a moeda — aparece só quando algo é conquistado. Tons claros e escuros de cada cor existem apenas para biséis, fundos de seleção e texto.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:2fr 1.2fr 1fr;gap:20px;min-height:300px\">\n      <div style=\"background:#4E6B45;color:#F2EEE3;padding:24px;display:flex;flex-direction:column;justify-content:space-between;margin:3px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B,inset 0 -10px 0 0 #3A5134\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">Principal · 70%<\u002Fspan>\n        <div><div style=\"font-size:34px;font-weight:600\">Verde Praça<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;margin-top:6px\">#4E6B45<\u002Fdiv><div style=\"font-size:15px;margin-top:10px;max-width:30ch\">Marca, botões primários, ONGs verificadas, blocos de progresso.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EEE3;color:#1E2A1B;padding:24px;display:flex;flex-direction:column;justify-content:space-between;margin:3px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B,inset 0 -10px 0 0 #D9D3C2\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">Base · 25%<\u002Fspan>\n        <div><div style=\"font-size:34px;font-weight:600\">Papel<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;margin-top:6px\">#F2EEE3<\u002Fdiv><div style=\"font-size:15px;margin-top:10px\">Fundos, placas sobre o vídeo, superfícies.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--aux);color:#1E2A1B;padding:24px;display:flex;flex-direction:column;justify-content:space-between;margin:3px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B,inset 0 -10px 0 0 var(--aux-700)\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">Auxiliar · 5%<\u002Fspan>\n        <div><div style=\"font-size:34px;font-weight:600\">Âmbar Moeda<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;margin-top:6px\">#E3A33B<\u002Fdiv><div style=\"font-size:15px;margin-top:10px\">XP, conquistas, foco, alertas.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:28px;margin-top:40px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:44px;background:#1E2A1B\"><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">Tinta · #1E2A1B<\u002Fspan><span style=\"font-size:14px;color:#4A5446\">Texto e contornos. Verde a 15% de luz.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:44px;background:#3A5134\"><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">Verde 700 · #3A5134<\u002Fspan><span style=\"font-size:14px;color:#4A5446\">Bisel e estado pressionado.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:44px;background:#DCE4D5\"><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">Verde 100 · #DCE4D5<\u002Fspan><span style=\"font-size:14px;color:#4A5446\">Seleção, hover, prefixos.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:44px;background:#D9D3C2\"><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">Papel 300 · #D9D3C2<\u002Fspan><span style=\"font-size:14px;color:#4A5446\">Bisel claro, blocos vazios.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:44px;background:var(--aux-700)\"><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">Âmbar 700 · #B47D22<\u002Fspan><span style=\"font-size:14px;color:#4A5446\">Bisel da moeda, borda de erro.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:16px;line-height:1.55;max-width:62ch;margin:36px 0 0;color:#4A5446\"><strong style=\"color:#1E2A1B\">Sem vermelho.<\u002Fstrong> Erros usam borda âmbar escura, ícone \"!\" e uma frase clara — atenção sem alarme, coerente com uma causa de cuidado.<\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"tipo\" style=\"padding:112px 0 0\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;margin-bottom:16px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#4E6B45;display:inline-flex;align-items:center;gap:8px\"><svg width=\"14\" height=\"12\" sc-camel-view-box=\"0 0 9 8\" style=\"shape-rendering:crispEdges\" aria-hidden=\"true\"><path fill=\"#4E6B45\" d=\"M2 0h2v2h-2zM5 0h2v2h-2zM0 2h2v2h-2zM7 2h2v2h-2zM3 3h3v1h-3zM2 4h5v1h-5zM1 5h7v2h-7zM2 7h2v1h-2zM5 7h2v1h-2z\"><\u002Fpath><\u002Fsvg>03<\u002Fspan><h2 style=\"font-family:'Manrope',sans-serif;font-weight:600;font-size:44px;line-height:1.05;margin:0\">Tipografia<\u002Fh2><\u002Fdiv>\n    <p style=\"font-size:19px;line-height:1.55;max-width:60ch;margin:0 0 48px;color:#4A5446;text-wrap:pretty\">Uma sans-serif firme e aberta para tudo que precisa ser lido e acreditado; uma monoespaçada para placares, rótulos e contadores. Nenhuma fonte pixel — o pixel fica na forma, não na letra.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:56px\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">Manrope · Leitura, valores e botões<\u002Fspan>\n        <div style=\"font-size:64px;font-weight:700;line-height:1;letter-spacing:-0.03em\">Aa Ç ã 0123<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">Display<\u002Fspan><span style=\"font-size:48px;font-weight:600;line-height:1.05;letter-spacing:-0.02em\">R$ 12.480<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">Título<\u002Fspan><span style=\"font-size:30px;font-weight:600;line-height:1.15\">Abrigo Quatro Patas<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">Texto<\u002Fspan><span style=\"font-size:18px;line-height:1.55\">Sua doação de R$ 50 garante uma semana de ração para seis cães resgatados.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">Citação<\u002Fspan><span style=\"font-size:20px;font-weight:500;line-height:1.45\">\"A gente vê a cidade crescer e sabe que é real.\"<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">JetBrains Mono · Placar e rótulos<\u002Fspan>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:56px;line-height:1\">Aa 0123<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">HUD<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:28px\">Nível 07<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">Contador<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:16px\">#12.847 · +50 XP<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">Rótulo<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em\">ONG verificada<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.55;color:#4A5446;margin:6px 0 0;max-width:40ch\">Mínimo de 12px na tela e 28px em vídeo 1080p. Só em textos curtos — nunca em parágrafos, valores de doação ou termos legais.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"assinatura\" style=\"padding:112px 0 0\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;margin-bottom:16px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#4E6B45;display:inline-flex;align-items:center;gap:8px\"><svg width=\"14\" height=\"12\" sc-camel-view-box=\"0 0 9 8\" style=\"shape-rendering:crispEdges\" aria-hidden=\"true\"><path fill=\"#4E6B45\" d=\"M2 0h2v2h-2zM5 0h2v2h-2zM0 2h2v2h-2zM7 2h2v2h-2zM3 3h3v1h-3zM2 4h5v1h-5zM1 5h7v2h-7zM2 7h2v1h-2zM5 7h2v1h-2z\"><\u002Fpath><\u002Fsvg>04<\u002Fspan><h2 style=\"font-family:'Manrope',sans-serif;font-weight:600;font-size:44px;line-height:1.05;margin:0\">Assinatura de jogo<\u002Fh2><\u002Fdiv>\n    <p style=\"font-size:19px;line-height:1.55;max-width:60ch;margin:0 0 48px;color:#4A5446;text-wrap:pretty\">Cinco detalhes formam a identidade. Use-os com moderação — juntos, eles fazem uma tela parecer Cidoe.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:48px 40px\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"height:120px;display:flex;align-items:center\"><div style=\"width:120px;height:80px;background:#FBF9F3;margin:3px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B\"><\u002Fdiv><\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">1 · Canto em pixel<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.5;color:#4A5446\">A borda de 2–3px pula o canto, como um sprite. Substitui o border-radius em tudo.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"height:120px;display:flex;align-items:center\"><div style=\"width:120px;height:80px;background:#4E6B45;margin:3px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B,inset 0 -10px 0 0 #3A5134\"><\u002Fdiv><\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">2 · Bisel sólido<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.5;color:#4A5446\">Uma faixa de 4px no tom 700 dá volume. Nos botões, soma-se uma sombra dura na diagonal.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"height:120px;display:flex;flex-direction:column;justify-content:center;gap:12px;font-family:'JetBrains Mono',monospace;font-size:14px\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><svg width=\"8\" height=\"14\" sc-camel-view-box=\"0 0 4 7\" style=\"shape-rendering:crispEdges\"><path fill=\"#4E6B45\" d=\"M0 0h1v7h-1zM1 1h1v5h-1zM2 2h1v3h-1zM3 3h1v1h-1z\"><\u002Fpath><\u002Fsvg><span>Doar agora<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;padding-left:18px;color:#4A5446\">Ver ONGs<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;padding-left:18px;color:#4A5446\">Minha cidade<\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">3 · Cursor de menu<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.5;color:#4A5446\">A seta ▸ marca a opção ativa em listas, menus e links com hover.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"height:120px;display:flex;align-items:center;gap:4px\">\n          <sc-for list=\"{{ demoBlocks }}\" as=\"b\" hint-placeholder-count=\"10\"><span style=\"width:14px;height:28px;background:{{ b }}\"><\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">4 · Barra em blocos<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.5;color:#4A5446\">Todo progresso é contado em blocos. O próximo bloco a conquistar acende em âmbar.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"height:120px;display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n          <svg width=\"32\" height=\"24\" sc-camel-view-box=\"0 0 8 6\" style=\"shape-rendering:crispEdges\"><path fill=\"#4E6B45\" d=\"M1 0h2v1h-2zM5 0h2v1h-2zM0 1h8v2h-8zM1 3h6v1h-6zM2 4h4v1h-4zM3 5h2v1h-2z\"><\u002Fpath><\u002Fsvg>\n          <svg width=\"32\" height=\"28\" sc-camel-view-box=\"0 0 9 8\" style=\"shape-rendering:crispEdges\"><path fill=\"#1E2A1B\" d=\"M2 0h2v2h-2zM5 0h2v2h-2zM0 2h2v2h-2zM7 2h2v2h-2zM3 3h3v1h-3zM2 4h5v1h-5zM1 5h7v2h-7zM2 7h2v1h-2zM5 7h2v1h-2z\"><\u002Fpath><\u002Fsvg>\n          <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 8 8\" style=\"shape-rendering:crispEdges\"><path fill=\"#E3A33B\" d=\"M2 0h4v1h-4zM1 1h6v1h-6zM0 2h8v4h-8zM1 6h6v1h-6zM2 7h4v1h-4z\"><\u002Fpath><path fill=\"#B47D22\" d=\"M3 2h2v4h-2z\"><\u002Fpath><\u002Fsvg>\n          <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 8 8\" style=\"shape-rendering:crispEdges\"><path fill=\"#4E6B45\" d=\"M2 0h4v1h-4zM1 1h6v7h-6z\"><\u002Fpath><path fill=\"#F2EEE3\" d=\"M2 2h1v1h-1zM5 2h1v1h-1zM2 4h1v1h-1zM5 4h1v1h-1zM3 6h2v2h-2z\"><\u002Fpath><\u002Fsvg>\n          <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 8 8\" style=\"shape-rendering:crispEdges\"><path fill=\"#EE9A4D\" d=\"M0 0h1v1h-1zM7 0h1v1h-1zM0 1h1v1h-1zM7 1h1v1h-1zM0 2h8v1h-8zM0 3h1v1h-1zM2 3h4v1h-4zM7 3h1v1h-1zM0 4h1v1h-1zM2 4h1v1h-1zM5 4h1v1h-1zM7 4h1v1h-1zM1 5h1v1h-1zM6 5h1v1h-1zM0 6h2v1h-2zM6 6h2v1h-2zM1 7h6v1h-6z\"><\u002Fpath><path fill=\"#FFF5E8\" d=\"M2 5h1v1h-1zM5 5h1v1h-1zM2 6h4v1h-4z\"><\u002Fpath><path fill=\"#F5A6AE\" d=\"M1 1h1v1h-1zM6 1h1v1h-1zM0 5h1v1h-1zM7 5h1v1h-1z\"><\u002Fpath><path fill=\"#E2788A\" d=\"M3 4h2v1h-2z\"><\u002Fpath><path fill=\"#2A1F1A\" d=\"M1 3h1v1h-1zM6 3h1v1h-1zM1 4h1v1h-1zM6 4h1v1h-1zM3 5h2v1h-2z\"><\u002Fpath><\u002Fsvg>\n          <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 8 8\" style=\"shape-rendering:crispEdges\"><path fill=\"#C98A4B\" d=\"M1 0h6v1h-6zM1 1h6v1h-6zM1 2h1v1h-1zM3 2h2v1h-2zM6 2h1v1h-1zM1 3h6v1h-6zM1 4h1v1h-1zM6 4h1v1h-1zM1 5h1v1h-1zM6 5h1v1h-1zM1 6h2v1h-2zM5 6h2v1h-2zM2 7h4v1h-4z\"><\u002Fpath><path fill=\"#8A5530\" d=\"M0 1h1v1h-1zM7 1h1v1h-1zM0 2h1v1h-1zM7 2h1v1h-1zM0 3h1v1h-1zM7 3h1v1h-1zM0 4h1v1h-1zM7 4h1v1h-1z\"><\u002Fpath><path fill=\"#2A1E17\" d=\"M2 2h1v1h-1zM5 2h1v1h-1zM3 4h2v1h-2z\"><\u002Fpath><path fill=\"#F8EBD5\" d=\"M2 4h1v1h-1zM5 4h1v1h-1zM2 5h4v1h-4z\"><\u002Fpath><path fill=\"#EF8E96\" d=\"M3 6h2v1h-2z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">5 · Ícones em pixel<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.5;color:#4A5446\">Grade 8×8. Ícones de interface em uma ou duas cores da marca; gato e cachorro usam cores de pelagem reais.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"imagem\" style=\"padding:112px 0 0\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;margin-bottom:16px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#4E6B45;display:inline-flex;align-items:center;gap:8px\"><svg width=\"14\" height=\"12\" sc-camel-view-box=\"0 0 9 8\" style=\"shape-rendering:crispEdges\" aria-hidden=\"true\"><path fill=\"#4E6B45\" d=\"M2 0h2v2h-2zM5 0h2v2h-2zM0 2h2v2h-2zM7 2h2v2h-2zM3 3h3v1h-3zM2 4h5v1h-5zM1 5h7v2h-7zM2 7h2v1h-2zM5 7h2v1h-2z\"><\u002Fpath><\u002Fsvg>05<\u002Fspan><h2 style=\"font-family:'Manrope',sans-serif;font-weight:600;font-size:44px;line-height:1.05;margin:0\">Imagem<\u002Fh2><\u002Fdiv>\n    <p style=\"font-size:19px;line-height:1.55;max-width:60ch;margin:0 0 56px;color:#4A5446;text-wrap:pretty\">Três tipos de imagem, cada um com um papel. A foto real prova que a ONG existe; a cena 3D mostra a recompensa; o pixel é tempero. A moldura é sempre a mesma — o canto em pixel das placas.<\u002Fp>\n\n    <div style=\"display:flex;flex-direction:column;gap:28px;margin-bottom:80px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">5.1 · Três tipos<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:48px 40px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"position:relative;aspect-ratio:3/2;background:#D9D3C2;margin:3px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B\"><image-slot id=\"img-tipo-foto\" shape=\"rect\" placeholder=\"Foto real · animal ou equipe da ONG\"><\u002Fimage-slot><\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45;padding-top:8px\">A · Foto real<\u002Fspan>\n          <h3 style=\"font-size:22px;font-weight:600;line-height:1.2;margin:0\">Prova que a ONG existe.<\u002Fh3>\n          <span style=\"font-size:16px;line-height:1.5;color:#4A5446\">Animais e pessoas da ONG, em cor natural. É a imagem que pede confiança — sem filtro, sem pixel, sem montagem.<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">3:2 · 4:5 · 1:1 · moldura de 3px<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"position:relative;aspect-ratio:3/2;background:#C9D5C0;margin:3px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B\"><image-slot id=\"img-tipo-cena\" shape=\"rect\" placeholder=\"Captura da cidade 3D\"><\u002Fimage-slot><\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45;padding-top:8px\">B · Cena da cidade<\u002Fspan>\n          <h3 style=\"font-size:22px;font-weight:600;line-height:1.2;margin:0\">Mostra a recompensa.<\u002Fh3>\n          <span style=\"font-size:16px;line-height:1.5;color:#4A5446\">Capturas da cena 3D. Sangram até a borda no HUD e nos vídeos; só ganham moldura quando entram numa página.<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">16:9 · 9:16 · sangria total<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"aspect-ratio:3/2;background:#FBF9F3;margin:3px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B;display:flex;align-items:flex-end;justify-content:center;gap:32px;padding-bottom:28px;box-sizing:border-box\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 8 8\" style=\"shape-rendering:crispEdges\"><path fill=\"#C98A4B\" d=\"M1 0h6v1h-6zM1 1h6v1h-6zM1 2h1v1h-1zM3 2h2v1h-2zM6 2h1v1h-1zM1 3h6v1h-6zM1 4h1v1h-1zM6 4h1v1h-1zM1 5h1v1h-1zM6 5h1v1h-1zM1 6h2v1h-2zM5 6h2v1h-2zM2 7h4v1h-4z\"><\u002Fpath><path fill=\"#8A5530\" d=\"M0 1h1v1h-1zM7 1h1v1h-1zM0 2h1v1h-1zM7 2h1v1h-1zM0 3h1v1h-1zM7 3h1v1h-1zM0 4h1v1h-1zM7 4h1v1h-1z\"><\u002Fpath><path fill=\"#2A1E17\" d=\"M2 2h1v1h-1zM5 2h1v1h-1zM3 4h2v1h-2z\"><\u002Fpath><path fill=\"#F8EBD5\" d=\"M2 4h1v1h-1zM5 4h1v1h-1zM2 5h4v1h-4z\"><\u002Fpath><path fill=\"#EF8E96\" d=\"M3 6h2v1h-2z\"><\u002Fpath><\u002Fsvg><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">×2<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 8 8\" style=\"shape-rendering:crispEdges\"><path fill=\"#C98A4B\" d=\"M1 0h6v1h-6zM1 1h6v1h-6zM1 2h1v1h-1zM3 2h2v1h-2zM6 2h1v1h-1zM1 3h6v1h-6zM1 4h1v1h-1zM6 4h1v1h-1zM1 5h1v1h-1zM6 5h1v1h-1zM1 6h2v1h-2zM5 6h2v1h-2zM2 7h4v1h-4z\"><\u002Fpath><path fill=\" >\n\n    <div style=\"display:flex;flex-direction:column;gap:28px;margin-bottom:80px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">5.2 · Proporções<\u002Fspan>\n      <div style=\"display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start\">\n        <div style=\"display:flex;flex-direction:column;gap:12px;min-width:150px;max-width:220px\">\n          <div style=\"position:relative;align-self:flex-start;height:120px;aspect-ratio:16/9;background:#D9D3C2;margin:2px;box-shadow:0 -2px 0 0 #1E2A1B,0 2px 0 0 #1E2A1B,-2px 0 0 0 #1E2A1B,2px 0 0 0 #1E2A1B\"><span style=\"position:absolute;left:50%;top:33.3%;width:10px;height:10px;margin:-5px 0 0 -5px;background:var(--aux);box-shadow:0 0 0 2px #1E2A1B\"><\u002Fspan><span style=\"position:absolute;left:10px;bottom:8px;font-family:'JetBrains Mono',monospace;font-size:12px\">16:9<\u002Fspan><\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4E6B45;padding-top:6px\">1920×1080<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.45;color:#4A5446\">Cena da cidade, HUD, vídeo<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;min-width:150px;max-width:220px\">\n          <div style=\"position:relative;align-self:flex-start;height:120px;aspect-ratio:3/2;background:#D9D3C2;margin:2px;box-shadow:0 -2px 0 0 #1E2A1B,0 2px 0 0 #1E2A1B,-2px 0 0 0 #1E2A1B,2px 0 0 0 #1E2A1B\"><span style=\"position:absolute;left:50%;top:33.3%;width:10px;height:10px;margin:-5px 0 0 -5px;background:var(--aux);box-shadow:0 0 0 2px #1E2A1B\"><\u002Fspan><span style=\"position:absolute;left:10px;bottom:8px;font-family:'JetBrains Mono',monospace;font-size:12px\">3:2<\u002Fspan><\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4E6B45;padding-top:6px\">1200×800<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.45;color:#4A5446\">Cartão de ONG, págin margin:3px;box-shadow:0 -3px 0 0 #1E2A1B,0 3px 0 0 #1E2A1B,-3px 0 0 0 #1E2A1B,3px 0 0 0 #1E2A1B\">\n            <image-slot id=\"img-texto-nao\" shape=\"rect\" placeholder=\"Cena ou foto\"><\u002Fimage-slot>\n            <div style=\"position:absolute;left:0;right:0;bottom:0;height:60%;z-index:2;pointer-events:none;background:linear-gradient(to bottom, rgba(30,42,27,0), rgba(30,42,27,0.7))\"><\u002Fdiv>\n            <div style=\"position:absolute;left:20px;bottom:18px;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:4px;color:#FFFFFF;text-shadow:0 1px 6px rgba(0,0,0,0.5)\">\n              <span style=\"font-size:12px\">Prédio #12.847<\u002Fspan>\n              <span style=\"font-size:20px;font-weight:600;line-height:1.2\">Sobrado da Família Souza<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-size:16px;line-height:1.5;color:#4A5446\">Texto direto na imagem, com véu escuro ou degradê. Some em cenas claras e quebra a regra da cor chapada.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;margin-bottom:80px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:28px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4E6B45\">5.6 · Avatares e logos<\u002Fspan>\n        <div style=\"display:flex;gap:32px;flex-wrap:wrap;align-items:flex-end\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"position:relative;width:72px;height:72px;background:#D9D3C2;margin:2px;box-shadow:0 -2px 0 0 #1E2A1B,0 2px 0 0 #1E2A1B,-2px 0 0 0 #1E2A1B,2px 0 0 0 #1E2A1B\"><image-slot id=\"img-avatar\" shape=\"rect\" placeholder=\"Foto\"><\u002Fimage-slot><\u002Fdiv>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#4A5446\">72 · Perfil<\u002Fspan>\n          <\u002Fdiv>\n
